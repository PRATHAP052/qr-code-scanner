<!DOCTYPE html>
<html>
<head>
    <title>EZ Checker - Register</title>
    <!-- மொபைல் சப்போர்ட்டுக்கான வியூபோர்ட் டேக் -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear {
            display: none;
        }
    </style>
</head>

<body class="cyber-bg">

    <video autoplay muted loop class="bg-video">
        <source src="{{ url_for('static', filename='video.mp4') }}" type="video/mp4">
    </video>

    <!-- மொபைலில் சரியாகச் சுருங்குவதற்காக Mobile Wrapper சேர்க்கப்பட்டுள்ளது -->
    <div class="mobile-wrapper">
        <div class="auth-card">

            <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo-img">

            <h2 style="color: white; margin-bottom: 20px; margin-top: 0; font-size: 1.8rem;">Create Account</h2>

            <form method="POST">

                <input type="text" name="username" placeholder="Username" required>
                <input type="email" name="email" placeholder="Email" required>

                <div class="password-box">
                    <input type="password" id="password" name="password" placeholder="Password" required>
                    <span class="eye-icon" onclick="togglePassword()">
                        <i class="fa-solid fa-eye" id="eye-icon-logo"></i>
                    </span>
                </div>

                <div class="btn-row">
                    <button class="btn">
                        <i class="fa fa-user-check"></i> Register
                    </button>
                    <a href="/" class="btn">
                        <i class="fa fa-arrow-left"></i> Back to Login
                    </a>
                </div>

            </form>

        </div>
    </div>

    <script>
        function togglePassword(){
            let pass = document.getElementById("password");
            let icon = document.getElementById("eye-icon-logo");
            
            if(pass.type === "password"){
                pass.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                pass.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }
    </script>
</body>
</html>
