<!DOCTYPE html>
<html>
<head>
    <title>EZ Checker - Admin Dashboard</title>
    <!-- மொபைல் சப்போர்ட்டுக்கான மிக முக்கியமான Viewport Tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden; }

        /* === TOP NAVIGATION === */
        .top-nav {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; height: 80px; padding: 0 40px; box-sizing: border-box;
            position: absolute; top: 0; left: 0; z-index: 20;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.2); 
        }

        .nav-logo-area img { width: 60px; filter: drop-shadow(0 0 10px #00ffff); animation: logoGlow 3s infinite; }

        /* Unified Top Logout Button */
        .nav-btn {
            height: 45px; border-radius: 10px; border: 1px solid rgba(255,60,60,0.4);
            background: rgba(255,60,60,0.15); color: #ff3c3c; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            text-decoration: none; transition: 0.3s; font-size: 1rem; padding: 0 20px; font-weight: bold;
        }
        .nav-btn:hover { background: rgba(255,60,60,0.35); box-shadow: 0 0 15px #ff3c3c; border-color: #ff3c3c; color: white; }

        /* === SPLIT LAYOUT === */
        .admin-main-container {
            display: flex; width: 100vw; height: 100vh; padding: 100px 30px 30px 30px; 
            box-sizing: border-box; gap: 25px; position: relative; z-index: 10;
        }

        .left-col { flex: 0 0 320px; display: flex; flex-direction: column; height: 100%; }
        .right-col { flex: 1; height: 100%; display: flex; flex-direction: column; }

        .panel-box {
            background: rgba(10, 15, 25, 0.75); backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 255, 0.2); border-radius: 15px; padding: 25px;
            display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            box-sizing: border-box; overflow: hidden; height: 100%;
        }

        /* === ANALYTICS CARDS === */
        .analytics-container { display: flex; flex-direction: column; gap: 15px; flex: 1; justify-content: space-between; }

        .stat-card {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03); transition: 0.4s ease;
            text-align: center; animation: float 4s ease-in-out infinite;
            padding: 15px;
        }

        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
        .stat-card:hover { border-color: #00ffff; background: rgba(0,255,255,0.08); box-shadow: 0 0 20px rgba(0, 255, 255, 0.2); }

        .stat-card i { font-size: 2rem; margin-bottom: 8px; filter: none !important; } 
        .stat-label { font-size: 0.7rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 1.8rem; font-weight: bold; color: white; margin-top: 5px; }

        .threat-icon { color: #ff3c3c; } 

        /* === CLOCK === */
        .cyber-clock {
            font-family: monospace; color: #00ffff; font-size: 1rem;
            background: rgba(0,255,255,0.1); padding: 5px 15px; border-radius: 8px;
            border: 1px solid rgba(0,255,255,0.3); margin-right: 20px;
        }

        /* === TABLE & MATCHED BUTTONS === */
        .table-container { flex: 1; overflow-y: auto; overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; color: white; min-width: 500px; }
        th { position: sticky; top: 0; background: rgba(15, 20, 30, 0.95); padding: 15px; text-align: left; border-bottom: 2px solid #00ffff; z-index: 5; }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .btn-edit {
            height: 38px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.15); color: white; cursor: pointer; padding: 0 15px; font-weight: bold; transition: 0.3s;
        }
        .btn-edit:hover { background: rgba(0,255,255,0.35); border-color: #00ffff; box-shadow: 0 0 10px #00ffff; }

        .btn-delete {
            height: 38px; border-radius: 8px; border: 1px solid rgba(255,60,60,0.4);
            background: rgba(255,60,60,0.15); color: #ff3c3c; cursor: pointer; padding: 0 15px; font-weight: bold; transition: 0.3s;
        }
        .btn-delete:hover { background: rgba(255,60,60,0.35); border-color: #ff3c3c; box-shadow: 0 0 10px #ff3c3c; color: white; }

        /* ========================================== */
        /* TABLET & MOBILE RESPONSIVE DESIGN          */
        /* ========================================== */

        /* Tablets (Screens 992px and below) */
        @media screen and (max-width: 992px) {
            body, html { 
                height: auto; 
                overflow-y: auto; /* Allow full page scrolling */
            }
            .admin-main-container {
                flex-direction: column; /* Stack left and right columns vertically */
                height: auto;
                min-height: 100vh;
                padding: 100px 20px 20px 20px;
            }
            .left-col {
                flex: none;
                width: 100%;
                height: auto;
            }
            .analytics-container {
                flex-direction: row; /* Stat cards side by side */
                flex-wrap: wrap;
            }
            .stat-card {
                flex: 1 1 30%; /* Take up equal space */
                min-width: 120px;
            }
            .right-col {
                height: 600px; /* Give a fixed height to the table box on tablets */
            }
        }

        /* Mobile Phones (Screens 600px and below) */
        @media screen and (max-width: 600px) {
            .top-nav {
                padding: 0 15px; /* Reduce padding for mobile */
            }
            .cyber-clock {
                display: none; /* Hide clock on mobile to save space */
            }
            .nav-btn {
                padding: 0 10px;
                font-size: 0.8rem;
                height: 35px;
            }
            .nav-logo-area img { 
                width: 45px; 
            }
            .admin-main-container {
                padding: 90px 10px 20px 10px;
                gap: 15px;
            }
            .panel-box {
                padding: 15px;
            }
            .analytics-container {
                flex-direction: column; /* Stack stat cards vertically on mobile */
            }
            .stat-card {
                width: 100%;
            }
            td, th { 
                padding: 10px; 
                font-size: 0.9rem;
            }
            .btn-edit, .btn-delete {
                padding: 0 10px;
                font-size: 0.8rem;
                height: 32px;
            }
        }
    </style>
</head>
<body class="cyber-bg" onload="updateClock()">
    <video autoplay muted loop class="bg-video"><source src="{{ url_for('static', filename='video.mp4') }}" type="video/mp4"></video>

    <nav class="top-nav">
        <div class="nav-logo-area"><img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo"></div>
        <div style="display: flex; align-items: center;">
            <div id="clock" class="cyber-clock">00:00:00</div>
            <a href="/logout" class="nav-btn"><i class="fa fa-sign-out-alt"></i> Logout</a>
        </div>
    </nav>

    <div class="admin-main-container">
        <!-- Analytics Column -->
        <div class="left-col">
            <div class="panel-box">
                <h3 style="color:white; margin:0 0 15px 0; border-bottom: 1px solid #00ffff; padding-bottom:10px; font-size: 1.1rem;">
                    <i class="fa fa-chart-line" style="color:#00ffff;"></i> System Analytics
                </h3>
                <div class="analytics-container">
                    <div class="stat-card">
                        <i class="fa fa-qrcode" style="color:#00ffff;"></i>
                        <span class="stat-label">Total Scans</span>
                        <span class="stat-value">{{ total_scans }}</span>
                    </div>
                    <div class="stat-card">
                        <i class="fa fa-shield-halved" style="color:#00ff88;"></i>
                        <span class="stat-label">Safe Links</span>
                        <span class="stat-value">{{ safe }}</span>
                    </div>
                    <div class="stat-card">
                        <i class="fa fa-virus-slash threat-icon"></i>
                        <span class="stat-label">Threats Blocked</span>
                        <span class="stat-value">{{ high_risk }}</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- User Management Column -->
        <div class="right-col">
            <div class="panel-box">
                <h3 style="color:white; margin:0; border-bottom: 1px solid #00ffff; padding-bottom:10px; font-size: 1.1rem;">
                    <i class="fa fa-users-gear" style="color:#00ffff;"></i> User Management
                </h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th style="text-align:center;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for u in users %}
                            <tr>
                                <td style="color:#00ffff; font-family:monospace;">#{{ u.id }}</td>
                                <td style="font-weight:bold;">{{ u.username }}</td>
                                <td style="color:#ccc;">{{ u.email }}</td>
                                <td style="display:flex; gap:10px; justify-content:center;">
                                    <button class="btn-edit" onclick="openEditModal('{{u.id}}','{{u.username}}','{{u.email}}')">
                                        <i class="fa fa-edit"></i> Edit
                                    </button>
                                    <form action="{{ url_for('admin_delete', id=u.id) }}" method="POST" style="margin:0;">
                                        <button type="submit" class="btn-delete">
                                            <i class="fa fa-trash"></i> Delete
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const time = now.getHours().toString().padStart(2, '0') + ":" + 
                         now.getMinutes().toString().padStart(2, '0') + ":" + 
                         now.getSeconds().toString().padStart(2, '0');
            document.getElementById('clock').innerText = time;
            setTimeout(updateClock, 1000);
        }
        function openEditModal(id, username, email) {
            document.getElementById('edit-username').value = username;
            document.getElementById('edit-email').value = email;
            document.getElementById('editForm').action = "/admin/edit/" + id;
            document.getElementById('editModal').style.display = "block";
        }
    </script>
</body>
</html>
